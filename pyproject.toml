[project]
name = "tether-qnx"
version = "0.1.0"
description = "Least-privilege QNX security policies from observed runs"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
tether = "tether.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["tether"]

[tool.setuptools.package-data]
tether = ["report_template.html"]
